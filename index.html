<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMC AI Scanner - Binance Chart</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e11;color:#eaecef;font-family:Arial,sans-serif}
#app{height:100%;display:flex;flex-direction:column}#top{height:56px;display:flex;gap:7px;align-items:center;padding:8px 12px;background:#181a20;border-bottom:1px solid #2b2f36}
.logo{font-size:20px;font-weight:800;color:#f0b90b;margin-right:10px}input{height:38px;width:180px;background:#0b0e11;color:#fff;border:1px solid #474d57;border-radius:5px;padding:0 10px;text-transform:uppercase}
button{border:0;border-radius:4px;background:#2b2f36;color:#eaecef;cursor:pointer;padding:9px 12px}button:hover,button.on{background:#3a404b;color:#f0b90b}#status{margin-left:auto;color:#848e9c;font-size:12px}
#body{display:flex;flex:1;min-height:0}#markets{width:205px;background:#181a20;border-right:1px solid #2b2f36}.market{height:51px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #252930;cursor:pointer}.market:hover,.market.active{background:#2b2f36}.market span{color:#f0b90b;font-size:12px}
#main{display:flex;flex-direction:column;flex:1;min-width:0}.toolbar{height:48px;display:flex;gap:3px;align-items:center;padding:6px;background:#181a20;border-bottom:1px solid #2b2f36;overflow:auto}.tool{min-width:38px;height:34px;padding:4px;font-size:16px}.tool small{font-size:10px}
#wrap{position:relative;flex:1;min-height:0}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#right{width:260px;background:#181a20;border-left:1px solid #2b2f36;overflow:auto}.title{padding:14px;font-weight:700}.row{display:grid;grid-template-columns:1fr 65px 75px;font-size:11px;padding:3px 10px}.ask{color:#f6465d}.bid{color:#0ecb81}
#tip{position:absolute;display:none;background:#181a20;border:1px solid #474d57;padding:6px;font-size:11px;pointer-events:none;z-index:5}
#menu{position:fixed;display:none;width:220px;background:#1e2026;border:1px solid #474d57;border-radius:5px;padding:5px;z-index:20}.mi{padding:10px}.mi:hover{background:#2b2f36}
#bottom{height:24px;background:#181a20;border-top:1px solid #2b2f36;color:#848e9c;font-size:11px;padding:5px 10px}
@media(max-width:850px){#markets{display:none}#right{display:none}.logo{display:none}}
</style>
</head>
<body>
<div id="app">
<div id="top">
<div class="logo">SMC AI SCANNER</div>
<input id="sym" value="BTCUSDT">
<button id="load">Load</button>
<button class="quick" data-s="BTCUSDT">BTC</button><button class="quick" data-s="ETHUSDT">ETH</button>
<button class="quick" data-s="AVAXUSDT">AVAX</button><button class="quick" data-s="SEIUSDT">SEI</button>
<button class="quick" data-s="TIAUSDT">TIA</button><button class="quick" data-s="API3USDT">API3</button>
<div id="status">Loading...</div>
</div>
<div id="body">
<aside id="markets">
<div class="market active" data-s="BTCUSDT"><b>BTC/USDT</b><span>--</span></div>
<div class="market" data-s="ETHUSDT"><b>ETH/USDT</b><span>--</span></div>
<div class="market" data-s="SOLUSDT"><b>SOL/USDT</b><span>--</span></div>
<div class="market" data-s="AVAXUSDT"><b>AVAX/USDT</b><span>--</span></div>
<div class="market" data-s="SEIUSDT"><b>SEI/USDT</b><span>--</span></div>
<div class="market" data-s="TIAUSDT"><b>TIA/USDT</b><span>--</span></div>
<div class="market" data-s="API3USDT"><b>API3/USDT</b><span>--</span></div>
</aside>
<main id="main">
<div class="toolbar">
<button class="tool on" data-t="cross">＋</button><button class="tool" data-t="select">↖</button>
<button class="tool" data-t="trend">╱</button><button class="tool" data-t="ray">↗</button>
<button class="tool" data-t="hline">━</button><button class="tool" data-t="hray">━›</button>
<button class="tool" data-t="vline">│</button><button class="tool" data-t="rect">□</button>
<button class="tool" data-t="fib">F</button><button class="tool" data-t="arrow">➤</button>
<button class="tool" data-t="path">⌁</button><button class="tool" data-t="price">$</button>
<button class="tool" id="mag">🧲</button><button class="tool" id="zin">＋</button><button class="tool" id="zout">－</button>
<button class="tool" id="fit">⛶</button><button class="tool" id="clear">⌫</button>
<span style="width:1px;background:#343a43;height:25px"></span>
<button class="tool tf" data-i="1m">1m</button><button class="tool tf" data-i="5m">5m</button>
<button class="tool tf on" data-i="15m">15m</button><button class="tool tf" data-i="30m">30m</button>
<button class="tool tf" data-i="1h">1h</button><button class="tool tf" data-i="4h">4h</button>
<button class="tool tf" data-i="1d">1D</button>
</div>
<div id="wrap"><canvas id="c"></canvas><div id="tip"></div></div>
<div id="bottom">Binance public live market data • Wheel zoom • Drag pan • Shift+drag horizontal • Right click reset • Magnet snap</div>
</main>
<aside id="right"><div class="title">ORDER BOOK</div><div id="book"></div></aside>
</div></div>
<div id="menu"><div class="mi" id="reset">Reset chart view</div><div class="mi" id="erase">Remove drawings</div><div class="mi" id="mag2">Magnet on/off</div></div>

<script>
const API='https://api.binance.com',WS='wss://stream.binance.com:9443/ws';
const C=document.getElementById('c'),X=C.getContext('2d'),W=document.getElementById('wrap');
let S='BTCUSDT',TF='15m',data=[],sock=null,dsock=null,book={a:[],b:[]},tool='cross',magnet=false,d=[],draft=null;
let view={a:0,b:0,ppb:8},drag=null;
function resize(){let r=W.getBoundingClientRect(),q=devicePixelRatio||1;C.width=r.width*q;C.height=r.height*q;C.style.width=r.width+'px';C.style.height=r.height+'px';X.setTransform(q,0,0,q,0,0);draw()}addEventListener('resize',resize);
function status(t){document.getElementById('status').textContent=t}
function f(n){return Number(n).toLocaleString(undefined,{maximumFractionDigits:n<1?8:2})}
function box(){return{l:55,r:W.clientWidth-7,t:15,b:W.clientHeight-55,w:W.clientWidth-62,h:W.clientHeight-70}}
function vis(){return data.slice(view.a,view.b)}
function range(v){let hi=Math.max(...v.map(x=>x.h)),lo=Math.min(...v.map(x=>x.l)),p=(hi-lo)*.08||1;return{hi:hi+p,lo:lo-p}}
function px(i,p){return p.l+(i-view.a+.5)*view.ppb}
function py(v,r,p){return p.t+(r.hi-v)/(r.hi-r.lo)*p.h}
function idx(x){return Math.floor((x-box().l)/view.ppb+view.a)}
function price(y){let p=box(),r=range(vis());return r.hi-(y-p.t)/p.h*(r.hi-r.lo)}
function mouse(e){let q=C.getBoundingClientRect();return{x:e.clientX-q.left,y:e.clientY-q.top}}
function snap(x,y){let i=Math.max(0,Math.min(data.length-1,idx(x))),pr=price(y);if(magnet&&data[i]){let z=data[i],v=[z.o,z.h,z.l,z.c];pr=v.reduce((a,b)=>Math.abs(b-pr)<Math.abs(a-pr)?b:a);x=px(i,box());y=py(pr,range(vis()),box())}return{x,y,i,price:pr}}
function draw(){
 let w=W.clientWidth,h=W.clientHeight;X.clearRect(0,0,w,h);X.fillStyle='#0b0e11';X.fillRect(0,0,w,h);
 let p=box(),v=vis();if(!v.length){X.fillStyle='#848e9c';X.font='14px Arial';X.fillText('Waiting for Binance data...',70,70);return}
 let r=range(v);X.strokeStyle='#20242b';X.setLineDash([2,4]);for(let i=0;i<7;i++){let y=p.t+i*p.h/6;X.beginPath();X.moveTo(p.l,y);X.lineTo(p.r,y);X.stroke()}for(let i=0;i<9;i++){let x=p.l+i*p.w/8;X.beginPath();X.moveTo(x,p.t);X.lineTo(x,p.b);X.stroke()}X.setLineDash([]);
 X.fillStyle='#848e9c';X.font='11px Arial';for(let i=0;i<7;i++){let y=p.t+i*p.h/6;X.fillText(f(r.hi-(r.hi-r.lo)*i/6),p.r-58,y-3)}
 let bw=Math.max(2,Math.min(14,view.ppb*.68));
 v.forEach((z,j)=>{let x=px(view.a+j,p),yo=py(z.o,r,p),yc=py(z.c,r,p),yh=py(z.h,r,p),yl=py(z.l,r,p),up=z.c>=z.o;X.strokeStyle=X.fillStyle=up?'#0ecb81':'#f6465d';X.beginPath();X.moveTo(x,yh);X.lineTo(x,yl);X.stroke();X.fillRect(x-bw/2,Math.min(yo,yc),bw,Math.max(1,Math.abs(yc-yo)))});
 X.fillStyle='#848e9c';X.textAlign='center';let st=Math.max(1,Math.floor(v.length/7));for(let j=0;j<v.length;j+=st)X.fillText(new Date(v[j].t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),px(view.a+j,p),p.b+22);
 d.forEach(z=>one(z,p,r));if(draft)one(draft,p,r);
 let last=data[data.length-1];if(last){let y=py(last.c,r,p);X.strokeStyle='#f0b90b';X.setLineDash([4,4]);X.beginPath();X.moveTo(p.l,y);X.lineTo(p.r,y);X.stroke();X.setLineDash([]);X.fillStyle='#f0b90b';X.fillRect(p.r,y-9,65,18);X.fillStyle='#111';X.textAlign='center';X.fillText(f(last.c),p.r+32,y+4)}
}
function one(z,p,r){
 let a=z.a,b=z.b;if(!a)return;X.save();X.strokeStyle='#f0b90b';X.fillStyle='rgba(240,185,11,.08)';X.lineWidth=2;
 if(['hline','price'].includes(z.type)){X.beginPath();X.moveTo(p.l,a.y);X.lineTo(p.r,a.y);X.stroke()}
 else if(z.type==='hray'){X.beginPath();X.moveTo(a.x,a.y);X.lineTo(p.r,a.y);X.stroke()}
 else if(z.type==='vline'){X.beginPath();X.moveTo(a.x,p.t);X.lineTo(a.x,p.b);X.stroke()}
 else if(['trend','ray','arrow'].includes(z.type)&&b){let dx=b.x-a.x,dy=b.y-a.y;X.beginPath();X.moveTo(a.x,a.y);X.lineTo(b.x,b.y);if(z.type==='ray'){let l=Math.hypot(dx,dy)||1;X.lineTo(b.x+dx/l*1500,b.y+dy/l*1500)}X.stroke();if(z.type==='arrow'){let ang=Math.atan2(dy,dx),s=9;X.beginPath();X.moveTo(b.x,b.y);X.lineTo(b.x-s*Math.cos(ang-.5),b.y-s*Math.sin(ang-.5));X.lineTo(b.x-s*Math.cos(ang+.5),b.y-s*Math.sin(ang+.5));X.fill()}}
 else if(z.type==='rect'&&b)X.fillRect(a.x,a.y,b.x-a.x,b.y-a.y),X.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);
 else if(z.type==='fib'&&b){let hi=Math.max(a.price,b.price),lo=Math.min(a.price,b.price);[0,.236,.382,.5,.618,.786,1].forEach(q=>{let pr=hi-(hi-lo)*q,y=py(pr,r,p);X.strokeStyle=q===.618?'#0ecb81':'#848e9c';X.beginPath();X.moveTo(Math.min(a.x,b.x),y);X.lineTo(p.r,y);X.stroke();X.fillStyle='#cfd3da';X.font='10px Arial';X.textAlign='left';X.fillText((q*100).toFixed(1)+'% '+f(pr),Math.min(a.x,b.x)+3,y-3)})}
 else if(z.type==='path'&&z.points&&z.points.length>1){X.beginPath();X.moveTo(z.points[0].x,z.points[0].y);z.points.slice(1).forEach(q=>X.lineTo(q.x,q.y));X.stroke()}
 X.restore()
}
async function load(){
 try{status('Loading Binance...');let r=await fetch(API+'/api/v3/klines?symbol='+S+'&interval='+TF+'&limit=500',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let a=await r.json();data=a.map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5]}));view.b=data.length;view.a=Math.max(0,data.length-100);view.ppb=Math.max(4,W.clientWidth/100);live();depth();status('Binance LIVE • '+S+' • '+TF);draw()}catch(e){status('BINANCE ERROR: '+e.message);draw()}}
function live(){if(sock)try{sock.close()}catch{};sock=new WebSocket(WS+'/'+S.toLowerCase()+'@kline_'+TF);sock.onmessage=e=>{let k=JSON.parse(e.data).k,z={t:+k.t,o:+k.o,h:+k.h,l:+k.l,c:+k.c,v:+k.v},last=data[data.length-1];if(last&&last.t===z.t)data[data.length-1]=z;else data.push(z);if(view.b>=data.length-1){view.b=data.length;view.a=Math.max(0,view.b-100)}draw()};sock.onclose=()=>setTimeout(live,2500)}
function depth(){if(dsock)try{dsock.close()}catch{};dsock=new WebSocket(WS+'/'+S.toLowerCase()+'@depth20@100ms');dsock.onmessage=e=>{let z=JSON.parse(e.data);book.a=z.a||[];book.b=z.b||[];renderBook()}}
function renderBook(){let el=document.getElementById('book'),a=book.a.slice(0,10).reverse(),b=book.b.slice(0,10);el.innerHTML='<div class=row><span>Price</span><span>Amount</span><span>Total</span></div>'+a.map(x=>'<div class="row ask"><span>'+f(+x[0])+'</span><span>'+x[1]+'</span><span>'+f(+x[0]*+x[1])+'</span></div>').join('')+b.map(x=>'<div class="row bid"><span>'+f(+x[0])+'</span><span>'+x[1]+'</span><span>'+f(+x[0]*+x[1])+'</span></div>').join('')}
function choose(s){S=s.toUpperCase();document.getElementById('sym').value=S;document.querySelectorAll('.market').forEach(x=>x.classList.toggle('active',x.dataset.s===S));load()}
document.getElementById('load').onclick=()=>choose(document.getElementById('sym').value.replace(/[^a-z0-9]/gi,'')||'BTCUSDT');document.getElementById('sym').onkeydown=e=>{if(e.key==='Enter')document.getElementById('load').click()};document.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>choose(x.dataset.s));
document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{TF=x.dataset.i;document.querySelectorAll('.tf').forEach(y=>y.classList.remove('on'));x.classList.add('on');load()});
document.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{tool=x.dataset.t;document.querySelectorAll('[data-t]').forEach(y=>y.classList.toggle('on',y.dataset.t===tool))});
document.getElementById('mag').onclick=()=>{magnet=!magnet;document.getElementById('mag').classList.toggle('on',magnet)};
document.getElementById('zin').onclick=()=>zoom(1.25);document.getElementById('zout').onclick=()=>zoom(.8);document.getElementById('fit').onclick=()=>fit();document.getElementById('clear').onclick=()=>{d=[];draft=null;draw()};
function zoom(k){let c=Math.floor((view.a+view.b)/2),n=Math.max(20,Math.min(data.length,Math.round((view.b-view.a)/k)));view.a=Math.max(0,c-Math.floor(n/2));view.b=Math.min(data.length,view.a+n);view.ppb=box().w/(view.b-view.a);draw()}
function fit(){view.b=data.length;view.a=Math.max(0,data.length-100);view.ppb=box().w/(view.b-view.a);draw()}
C.oncontextmenu=e=>{e.preventDefault();let m=document.getElementById('menu');m.style.display='block';m.style.left=e.clientX+'px';m.style.top=e.clientY+'px'};
addEventListener('click',e=>{if(!e.target.closest('#menu'))document.getElementById('menu').style.display='none'});document.getElementById('reset').onclick=()=>{fit();document.getElementById('menu').style.display='none'};document.getElementById('erase').onclick=()=>{d=[];draft=null;draw();document.getElementById('menu').style.display='none'};document.getElementById('mag2').onclick=()=>{magnet=!magnet;document.getElementById('menu').style.display='none'};
C.onmousedown=e=>{if(e.button!==0)return;let q=mouse(e);if(tool==='cross'||tool==='select'){drag={x:q.x,y:q.y};return}if(['hline','hray','vline','price'].includes(tool)){d.push({type:tool,a:snap(q.x,q.y)});draw();return}if(tool==='path'){if(!draft)draft={type:'path',points:[snap(q.x,q.y)]};else{d.push(draft);draft=null}draw();return}draft={type:tool,a:snap(q.x,q.y),b:snap(q.x,q.y)}};
C.onmousemove=e=>{let q=mouse(e);if(draft){if(draft.type==='path')draft.points.push(snap(q.x,q.y));else draft.b=snap(q.x,q.y);draw()}if(drag){let dx=q.x-drag.x,dy=q.y-drag.y;if(e.shiftKey){view.a=Math.max(0,view.a-Math.round(dx/view.ppb));view.b=Math.min(data.length,view.b-Math.round(dx/view.ppb))}else{let n=Math.round(dx/view.ppb);view.a=Math.max(0,view.a-n);view.b=Math.min(data.length,view.b-n)}drag={x:q.x,y:q.y};draw()}};
C.onmouseup=e=>{if(drag){drag=null;return}if(draft&&draft.type!=='path'){if(Math.hypot(draft.b.x-draft.a.x,draft.b.y-draft.a.y)>3)d.push(draft);draft=null;draw()}};
C.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.18:.85)};

resize();load();
</script>
</body>
</html>
