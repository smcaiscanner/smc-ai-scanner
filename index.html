<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMC AI Scanner</title>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0b0e11;
    color:#eaecef;
    font-family:Arial,Helvetica,sans-serif
}

button,input,select{
    font:inherit
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column
}

/* TOP BAR */

.topbar{
    height:58px;
    flex-shrink:0;
    background:#181a20;
    border-bottom:1px solid #2b2f36;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
}

.logo{
    font-size:20px;
    font-weight:bold;
    color:#f0b90b;
    margin-right:12px;
    white-space:nowrap
}

.symbolInput{
    width:190px;
    height:38px;
    background:#0b0e11;
    border:1px solid #3b4048;
    border-radius:5px;
    color:#fff;
    padding:0 10px;
    text-transform:uppercase
}

.btn{
    height:38px;
    background:#2b2f36;
    border:1px solid #3b4048;
    color:#eaecef;
    padding:0 13px;
    border-radius:5px;
    cursor:pointer
}

.btn:hover{
    background:#3a3f47
}

.btn.active{
    background:#f0b90b;
    color:#111;
    border-color:#f0b90b
}

.aiBtn{
    background:#f0b90b;
    color:#111;
    font-weight:bold
}

.spacer{flex:1}

.status{
    color:#848e9c;
    font-size:12px
}

/* BODY */

.body{
    flex:1;
    min-height:0;
    display:flex
}

.marketbar{
    width:220px;
    background:#181a20;
    border-right:1px solid #2b2f36;
    overflow:auto;
    flex-shrink:0
}

.marketTitle{
    padding:14px 16px;
    color:#848e9c;
    font-size:12px;
    font-weight:bold
}

.market{
    height:48px;
    padding:0 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #202329;
    cursor:pointer
}

.market:hover{
    background:#202329
}

.market.active{
    background:#2b2f36
}

.marketPrice{
    color:#f0b90b
}

/* MAIN */

.main{
    flex:1;
    min-width:0;
    min-height:0;
    position:relative;
    display:flex;
    flex-direction:column
}

.chartHeader{
    height:88px;
    background:#0b0e11;
    border-bottom:1px solid #22252b;
    flex-shrink:0;
    padding:9px 16px
}

.chartTitle{
    font-size:18px;
    margin-bottom:12px
}

.price{
    color:#0ecb81;
    margin-left:8px
}

.timeframes{
    display:flex;
    gap:5px
}

.tf{
    border:0;
    background:transparent;
    color:#848e9c;
    padding:5px 10px;
    cursor:pointer;
    border-radius:4px
}

.tf:hover,.tf.active{
    background:#2b2f36;
    color:#f0b90b
}

.chartArea{
    position:relative;
    flex:1;
    min-height:0;
    background:#0b0e11
}

#chart{
    position:absolute;
    inset:0
}

/* TOOLBAR */

.toolbar{
    position:absolute;
    left:8px;
    top:8px;
    z-index:20;
    width:48px;
    background:#181a20;
    border:1px solid #30343b;
    border-radius:7px;
    overflow:hidden
}

.tool{
    width:48px;
    height:46px;
    background:#181a20;
    border:0;
    color:#eaecef;
    cursor:pointer;
    font-size:18px
}

.tool:hover{
    background:#2b2f36
}

.tool.active{
    background:#3b4048;
    color:#f0b90b
}

/* DRAWING LAYER */

#drawingLayer{
    position:absolute;
    inset:0;
    z-index:10;
    pointer-events:none
}

.drawCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%
}

/* AI */

.aiPanel{
    width:360px;
    background:#181a20;
    border-left:1px solid #2b2f36;
    display:none;
    flex-direction:column;
    flex-shrink:0
}

.aiPanel.open{
    display:flex
}

.aiHeader{
    height:55px;
    padding:0 14px;
    display:flex;
    align-items:center;
    border-bottom:1px solid #2b2f36;
    font-weight:bold;
    color:#f0b90b
}

.aiHeader button{
    margin-left:auto;
    background:none;
    border:0;
    color:#aaa;
    cursor:pointer;
    font-size:20px
}

.aiMessages{
    flex:1;
    overflow:auto;
    padding:12px
}

.msg{
    background:#23272e;
    border-radius:6px;
    padding:12px;
    margin-bottom:10px;
    line-height:1.5;
    white-space:pre-wrap;
    font-size:13px
}

.msg.user{
    border-left:3px solid #f0b90b
}

.msg.ai{
    border-left:3px solid #0ecb81
}

.aiBottom{
    padding:10px;
    border-top:1px solid #2b2f36
}

.aiInput{
    width:100%;
    min-height:75px;
    resize:none;
    background:#0b0e11;
    border:1px solid #3b4048;
    border-radius:6px;
    color:#fff;
    padding:10px
}

.aiButtons{
    display:flex;
    gap:7px;
    margin-top:8px
}

.aiButtons button{
    flex:1
}

/* MOBILE */

@media(max-width:900px){
    .marketbar{display:none}
    .aiPanel{
        position:absolute;
        z-index:50;
        right:0;
        top:0;
        bottom:0;
        width:min(380px,100%)
    }
}
</style>
</head>

<body>

<script>
/* =========================================================
   SMC AI SCANNER
   LIVE BINANCE DATA + AI CHART ACCESS
   ========================================================= */

const API = "https://api.binance.com/api/v3";

let symbol = "BTCUSDT";
let timeframe = "15m";
let candles = [];
let ws = null;

let currentTool = "crosshair";
let drawing = false;
let startPoint = null;
let drawings = [];

const chartEl = document.getElementById("chart");
const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");

const chart = LightweightCharts.createChart(chartEl, {
    layout:{
        background:{color:"#0b0e11"},
        textColor:"#848e9c"
    },

    grid:{
        vertLines:{color:"#1d2026"},
        horzLines:{color:"#1d2026"}
    },

    crosshair:{
        mode:LightweightCharts.CrosshairMode.Normal
    },

    rightPriceScale:{
        borderColor:"#2b2f36"
    },

    timeScale:{
        borderColor:"#2b2f36",
        timeVisible:true,
        secondsVisible:false,
        rightOffset:8,
        barSpacing:7
    },

    handleScroll:{
        mouseWheel:true,
        pressedMouseMove:true,
        horzTouchDrag:true,
        vertTouchDrag:true
    },

    handleScale:{
        mouseWheel:true,
        pinch:true,
        axisPressedMouseMove:{
            time:true,
            price:true
        }
    }
});

const candleSeries = chart.addCandlestickSeries({
    upColor:"#0ecb81",
    downColor:"#f6465d",
    borderUpColor:"#0ecb81",
    borderDownColor:"#f6465d",
    wickUpColor:"#0ecb81",
    wickDownColor:"#f6465d"
});

const volumeSeries = chart.addHistogramSeries({
    priceFormat:{type:"volume"},
    priceScaleId:"volume",
    scaleMargins:{
        top:0.82,
        bottom:0
    }
});

chart.priceScale("volume").applyOptions({
    scaleMargins:{
        top:0.82,
        bottom:0
    }
});


function resize(){

    const rect = chartEl.getBoundingClientRect();

    chart.resize(
        Math.max(100,rect.width),
        Math.max(100,rect.height)
    );

    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;

    canvas.style.width = rect.width+"px";
    canvas.style.height = rect.height+"px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    redraw();
}

window.addEventListener("resize",resize);


/* =========================================================
   BINANCE
   ========================================================= */

async function loadCandles(){

    setStatus("Loading Binance...");

    try{

        const url =
            `${API}/klines?symbol=${symbol}&interval=${timeframe}&limit=500`;

        const response = await fetch(url);

        if(!response.ok){
            throw new Error("Binance HTTP "+response.status);
        }

        const data = await response.json();

        candles = data.map(x=>({

            time:Math.floor(x[0]/1000),

            open:Number(x[1]),
            high:Number(x[2]),
            low:Number(x[3]),
            close:Number(x[4]),
            volume:Number(x[5])

        }));

        candleSeries.setData(
            candles.map(c=>({
                time:c.time,
                open:c.open,
                high:c.high,
                low:c.low,
                close:c.close
            }))
        );

        volumeSeries.setData(
            candles.map(c=>({
                time:c.time,
                value:c.volume,
                color:c.close >= c.open
                    ? "#0ecb81"
                    : "#f6465d"
            }))
        );

        chart.timeScale().fitContent();

        updatePrice(
            candles[candles.length-1].close
        );

        setStatus("● LIVE Binance");

        connectWebsocket();

        resize();

    }catch(error){

        console.error(error);

        setStatus("Binance connection error");

    }
}


function connectWebsocket(){

    if(ws){

        try{
            ws.close();
        }catch(e){}

    }

    const stream =
        `${symbol.toLowerCase()}@kline_${timeframe}`;

    ws = new WebSocket(
        `wss://stream.binance.com:9443/ws/${stream}`
    );

    ws.onopen=()=>{
        setStatus("● LIVE Binance")
    };

    ws.onmessage=(event)=>{

        const msg=JSON.parse(event.data);

        if(!msg.k)return;

        const k=msg.k;

        const candle={

            time:Math.floor(k.t/1000),

            open:Number(k.o),
            high:Number(k.h),
            low:Number(k.l),
            close:Number(k.c),
            volume:Number(k.v)

        };

        const last=candles[candles.length-1];

        if(last && last.time===candle.time){

            candles[candles.length-1]=candle;

        }else{

            candles.push(candle);

            if(candles.length>500){
                candles.shift();
            }

        }

        candleSeries.update({
            time:candle.time,
            open:candle.open,
            high:candle.high,
            low:candle.low,
            close:candle.close
        });

        volumeSeries.update({
            time:candle.time,
            value:candle.volume,
            color:candle.close>=candle.open
                ? "#0ecb81"
                : "#f6465d"
        });

        updatePrice(candle.close);
    };

    ws.onerror=()=>{
        setStatus("Binance websocket error")
    };
}


/* =========================================================
   SYMBOL / TIMEFRAME
   ========================================================= */

function updatePrice(price){

    document.getElementById("currentPrice")
        .textContent=formatPrice(price);

    const marketPrice=
        document.getElementById("price-"+symbol);

    if(marketPrice){
        marketPrice.textContent=formatPrice(price);
    }
}

function formatPrice(n){

    if(n===undefined)return "--";

    if(n>=1000)return n.toLocaleString(
        undefined,
        {maximumFractionDigits:2}
    );

    if(n>=1)return n.toFixed(4);

    return n.toFixed(6);
}

function setStatus(text){
    document.getElementById("status").textContent=text;
}

function changeSymbol(newSymbol){

    symbol=newSymbol.toUpperCase();

    document.getElementById("symbolInput").value=symbol;

    document.getElementById("chartSymbol").textContent=
        symbol.replace("USDT","/USDT");

    document.querySelectorAll(".market")
        .forEach(x=>{
            x.classList.toggle(
                "active",
                x.dataset.symbol===symbol
            );
        });

    loadCandles();
}

function changeTimeframe(tf){

    timeframe=tf;

    document.querySelectorAll(".tf")
        .forEach(x=>{
            x.classList.toggle(
                "active",
                x.dataset.tf===tf
            );
        });

    loadCandles();
}


/* =========================================================
   TOOL SYSTEM
   ========================================================= */

document.querySelectorAll(".tool").forEach(button=>{

    button.addEventListener("click",()=>{

        if(button.id==="clearDrawings"){

            drawings=[];

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            return;
        }

        currentTool=button.dataset.tool;

        document.querySelectorAll(".tool")
            .forEach(x=>x.classList.remove("active"));

        button.classList.add("active");

        canvas.style.pointerEvents=
            currentTool==="crosshair"
                ? "none"
                : "auto";
    });
});


canvas.addEventListener("pointerdown",e=>{

    if(currentTool==="crosshair")return;

    drawing=true;

    const rect=canvas.getBoundingClientRect();

    startPoint={
        x:e.clientX-rect.left,
        y:e.clientY-rect.top
    };

});


canvas.addEventListener("pointermove",e=>{

    if(!drawing)return;

    const rect=canvas.getBoundingClientRect();

    const endPoint={
        x:e.clientX-rect.left,
        y:e.clientY-rect.top
    };

    redraw();

    drawPreview(
        startPoint,
        endPoint,
        currentTool
    );
});


canvas.addEventListener("pointerup",e=>{

    if(!drawing)return;

    drawing=false;

    const rect=canvas.getBoundingClientRect();

    const endPoint={
        x:e.clientX-rect.left,
        y:e.clientY-rect.top
    };

    drawings.push({

        type:currentTool,

        start:{...startPoint},

        end:{...endPoint}

    });

    redraw();
});


function drawPreview(a,b,type){

    drawObject(a,b,type,true);
}


function redraw(){

    const rect=canvas.getBoundingClientRect();

    ctx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );

    drawings.forEach(d=>{

        drawObject(
            d.start,
            d.end,
            d.type,
            false
        );

    });
}


function drawObject(a,b,type,preview){

    ctx.save();

    ctx.lineWidth=2;

    ctx.strokeStyle=
        preview
            ? "#f0b90b"
            : "#f0b90b";

    ctx.fillStyle="rgba(240,185,11,.12)";

    if(type==="trendline"){

        line(a.x,a.y,b.x,b.y);

    }

    else if(type==="ray"){

        let dx=b.x-a.x;
        let dy=b.y-a.y;

        const length=2000;

        const len=Math.sqrt(dx*dx+dy*dy)||1;

        dx/=len;
        dy/=len;

        line(
            a.x,
            a.y,
            a.x+dx*length,
            a.y+dy*length
        );

    }

    else if(type==="horizontal"){

        line(
            0,
            a.y,
            canvas.clientWidth,
            a.y
        );

    }

    else if(type==="vertical"){

        line(
            a.x,
            0,
            a.x,
            canvas.clientHeight
        );

    }

    else if(type==="rectangle"){

        ctx.strokeRect(
            a.x,
            a.y,
            b.x-a.x,
            b.y-a.y
        );

        ctx.fillRect(
            a.x,
            a.y,
            b.x-a.x,
            b.y-a.y
        );

    }

    else if(type==="arrow"){

        drawArrow(a,b);

    }

    else if(type==="fib"){

        drawFib(a,b);

    }

    else if(type==="long"){

        drawPosition(a,b,true);

    }

    else if(type==="short"){

        drawPosition(a,b,false);

    }

    ctx.restore();
}


function line(x1,y1,x2,y2){

    ctx.beginPath();

    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);

    ctx.stroke();
}


function drawArrow(a,b){

    line(a.x,a.y,b.x,b.y);

    const angle=Math.atan2(
        b.y-a.y,
        b.x-a.x
    );

    const size=10;

    ctx.beginPath();

    ctx.moveTo(b.x,b.y);

    ctx.lineTo(
        b.x-size*Math.cos(angle-.5),
        b.y-size*Math.sin(angle-.5)
    );

    ctx.lineTo(
        b.x-size*Math.cos(angle+.5),
        b.y-size*Math.sin(angle+.5)
    );

    ctx.closePath();

    ctx.fillStyle="#f0b90b";

    ctx.fill();
}


function drawFib(a,b){

    const levels=[
        0,
        .236,
        .382,
        .5,
        .618,
        .786,
        1
    ];

    const height=b.y-a.y;

    levels.forEach(level=>{

        const y=a.y+height*level;

        line(
            Math.min(a.x,b.x),
            y,
            Math.max(a.x,b.x),
            y
        );

        ctx.fillStyle="#f0b90b";

        ctx.font="11px Arial";

        ctx.fillText(
            (level*100).toFixed(1)+"%",
            Math.max(a.x,b.x)+5,
            y-3
        );

    });
}


function drawPosition(a,b,long){

    const entry=a.y;

    const target=b.y;

    const risk=
        long
            ? Math.abs(target-entry)
            : Math.abs(entry-target);

    ctx.fillStyle=
        long
            ? "rgba(14,203,129,.12)"
            : "rgba(246,70,93,.12)";

    const top=Math.min(entry,target);
    const height=Math.abs(target-entry);

    ctx.fillRect(
        a.x,
        top,
        Math.abs(b.x-a.x),
        height
    );

    ctx.strokeStyle=
        long
            ? "#0ecb81"
            : "#f6465d";

    line(
        Math.min(a.x,b.x),
        entry,
        Math.max(a.x,b.x),
        entry
    );

    ctx.fillStyle=
        long
            ? "#0ecb81"
            : "#f6465d";

    ctx.font="12px Arial";

    ctx.fillText(
        long ? "LONG" : "SHORT",
        Math.min(a.x,b.x)+5,
        top+15
    );
}

const aiPanel=document.getElementById("aiPanel");

document.getElementById("aiOpen")
    .onclick=()=>{
        aiPanel.classList.add("open");
    };

document.getElementById("aiClose")
    .onclick=()=>{
        aiPanel.classList.remove("open");
    };


function addMessage(text,type){

    const box=document.createElement("div");

    box.className="msg "+type;

    box.textContent=text;

    document.getElementById("aiMessages")
        .appendChild(box);

    box.scrollIntoView({
        behavior:"smooth",
        block:"end"
    });

    return box;
}


function buildChartContext(){

    const recent=candles.slice(-200);

    return {

        symbol,

        timeframe,

        currentPrice:
            candles.length
                ? candles[candles.length-1].close
                : null,

        candles:recent,

        drawings:drawings.map(d=>({

            type:d.type,

            start:d.start,

            end:d.end

        }))

    };
}


async function askAI(mode){

    if(!candles.length){

        addMessage(
            "No Binance candle data available yet.",
            "ai"
        );

        return;
    }

    const input=
        document.getElementById("aiInput").value.trim();

    const question=
        input ||
        "Analyze this chart using my SMC methodology.";

    addMessage(
        question,
        "user"
    );

    const loading=addMessage(
        "AI is analyzing the live Binance candles...",
        "ai"
    );

    try{

        const response=await fetch(
            "/api/ai",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    mode,

                    question,

                    chart:buildChartContext()

                })
            }
        );

        const raw=await response.text();

        let data;

        try{
            data=JSON.parse(raw);
        }catch(e){

            throw new Error(
                "Server returned invalid JSON: "+raw.slice(0,500)
            );

        }

        loading.remove();

        if(!response.ok){

            addMessage(
                "AI ERROR:\n"+(
                    data.error ||
                    "Unknown server error"
                ),
                "ai"
            );

            return;
        }

        addMessage(
            data.answer || "No AI response.",
            "ai"
        );

    }catch(error){

        loading.remove();

        addMessage(
            "AI connection error:\n"+error.message,
            "ai"
        );

        console.error(error);
    }
}


document.getElementById("analyzeBtn")
    .onclick=()=>{
        askAI("analyze");
    };


document.getElementById("teachBtn")
    .onclick=()=>{

        const text=
            document.getElementById("aiInput")
                .value.trim();

        if(!text){

            addMessage(
                "Write your SMC rule first, for example: 'A sell-side liquidity sweep must close back above the swept low.'",
                "ai"
            );

            return;
        }

        askAI("teach");
    };
